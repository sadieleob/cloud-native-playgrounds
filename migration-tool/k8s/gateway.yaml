---
# The enterprise-kgateway GatewayClass is created by the Helm chart.
# We just need a Gateway that references it.
#
# Before applying, substitute the placeholders:
#   WILDCARD_HOSTNAME_PLACEHOLDER → your wildcard domain, e.g. *.example.com
#   TLS_SECRET_PLACEHOLDER        → name of the TLS secret you created
#
# The README shows a sed one-liner to do this.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: https
  namespace: kgateway-system
spec:
  gatewayClassName: enterprise-kgateway
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    hostname: "WILDCARD_HOSTNAME_PLACEHOLDER"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: TLS_SECRET_PLACEHOLDER
        namespace: kgateway-system
    allowedRoutes:
      namespaces:
        from: All
